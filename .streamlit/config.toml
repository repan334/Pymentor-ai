[theme]
primaryColor = "#126B52"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF5F2"
textColor = "#17231F"
font = "sans-serif"

[server]
headless = true
# Match the backend MAX_UPLOAD_SIZE_MB so the uploader hint and client-side
# rejection agree with the API's real file limit.
maxUploadSize = 10
